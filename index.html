<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Sale</title>
    <link rel="shortcut icon" href="assets/images/Summer 1.png" type="image/x-icon">
    <!-- tailwindcss cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- tailwindcss cdn -->

    <!-- font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        .work-sans {
            font-family: 'Work Sans', sans-serif;
        }
    </style>
    <!-- font  -->
</head>

<body class="work-sans bg-[#F8F8F8]">
    <header
        class="bg-[#F9F6E2] px-5 py-16 flex flex-col-reverse justify-center items-center gap-5 lg:flex-row lg:px-24 lg:py-5">
        <section class="flex-1 space-y-5">
            <h2 class="text-3xl text-[#111]">SUMMER SALE</h2>
            <p class="text-5xl text-black font-bold w-full lg:w-11/12 tracking-normal">Purchase
                TK 200 or above & get <span class="text-[#E527B2] font-extrabold">20% off</span></p>
            <span class="text-[#111]">Use Promo Code</span>
            <button class="btn bg-[#E527B2]">SELL200</button>
        </section>

        <figure class="flex-1">
            <img src="assets/images/Summer 1.png" alt="banner" srcset width="90%">
        </figure>
    </header>
    <main class="container mx-auto mt-16 flex flex-col-reverse justify-center  gap-5 lg:flex-row"><!-- card start -->
        <section class="px-5 pb-5">
            <!-- kitchenware -->
            <section class>
                <h2 class="text-black text-4xl font-bold">Kitchenware</h2>
                <div class="mt-5 grid grid-cols-1 gap-5 justify-center items-center md:grid-cols-2 lg:grid-cols-3 ">
                    <!-- card-1 -->
                    <div class="card bg-base-100 shadow-xl p-5" id="kitchenware-card-1">
                        <figure class=" bg-gray-300 rounded-lg w-11/12 mx-auto">
                            <img src="assets/images/prod1.png" alt="product" class="rounded-xl" />
                        </figure>
                        <div class="card-body items-center text-center">
                            <div class="rating">
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" checked />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                            </div>
                            <h2 class="text-xl text-[#111] font-semibold">K.
                                Accessories</h2>
                            <p class="text-gray-500">39.00 TK</p>
                        </div>
                    </div>
                    <!-- card-1 end -->

                    <!-- card-2 -->
                    <div class="card bg-base-100 shadow-xl p-5" id="kitchenware-card-2">
                        <figure class=" bg-gray-300 rounded-lg w-11/12 mx-auto">
                            <img src="assets/images/prod2.png" alt="product" class="rounded-xl" />
                        </figure>
                        <div class="card-body items-center text-center">
                            <div class="rating">
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" checked />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                            </div>
                            <h2 class="text-xl text-[#111] font-semibold">K.
                                Accessories</h2>
                            <p class="text-gray-500">25.00 TK</p>
                        </div>
                    </div>
                    <!-- card-2 end -->

                    <!-- card-3 -->
                    <div class="card bg-base-100 shadow-xl p-5" id="kitchenware-card-3">
                        <figure class=" bg-gray-300 rounded-lg w-11/12 mx-auto">
                            <img src="assets/images/prod3.png" alt="product" class="rounded-xl" />
                        </figure>
                        <div class="card-body items-center text-center">
                            <div class="rating">
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" checked />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                            </div>
                            <h2 class="text-xl text-[#111] font-semibold">Home
                                Cooker</h2>
                            <p class="text-gray-500">49.00 TK</p>
                        </div>
                    </div>
                    <!-- card-3 end -->
                </div>
            </section>
            <!-- kitchenware end -->

            <!-- Sportswear -->
            <section class="mt-5">
                <h2 class="text-black text-4xl font-bold">Sportswear</h2>
                <div class="mt-5 grid grid-cols-1 gap-5 justify-center items-center md:grid-cols-2 lg:grid-cols-3 ">
                    <!-- card-1 -->
                    <div class="card bg-base-100 shadow-xl p-5" id="Sportswear-card-1">
                        <figure class=" bg-gray-300 rounded-lg w-11/12 mx-auto">
                            <img src="assets/images/prod4.png" alt="product" class="rounded-xl" />
                        </figure>
                        <div class="card-body items-center text-center">
                            <div class="rating">
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" checked />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                            </div>
                            <h2 class="text-xl text-[#111] font-semibold" id="product-one">Sports
                                Back Cap</h2>
                            <p class="text-gray-500" id="productOne-price">49.00
                                TK</p>
                        </div>
                    </div>
                    <!-- card-1 end -->

                    <!-- card-2 -->
                    <div class="card bg-base-100 shadow-xl p-5" id="Sportswear-card-2">
                        <figure class=" bg-gray-300 rounded-lg w-11/12 mx-auto">
                            <img src="assets/images/prod5.png" alt="product" class="rounded-xl" />
                        </figure>
                        <div class="card-body items-center text-center">
                            <div class="rating">
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" checked />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                            </div>
                            <h2 class="text-xl text-[#111] font-semibold">Full
                                Jersey Set
                            </h2>
                            <p class="text-gray-500">69.00 TK</p>
                        </div>
                    </div>
                    <!-- card-2 end -->

                    <!-- card-3 -->
                    <div class="card bg-base-100 shadow-xl p-5" id="Sportswear-card-3">
                        <figure class=" bg-gray-300 rounded-lg w-11/12 mx-auto">
                            <img src="assets/images/prod6.png" alt="product" class="rounded-xl" />
                        </figure>
                        <div class="card-body items-center text-center">
                            <div class="rating">
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" checked />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                                <input type="radio" name="rating-2" class="mask mask-star-2 bg-orange-400" />
                            </div>
                            <h2 class="text-xl text-[#111] font-semibold">Sports
                                cates
                            </h2>
                            <p class="text-gray-500">159.00 TK</p>
                        </div>
                    </div>
                    <!-- card-3 end -->
                </div>
            </section>
            <!-- Sportswear end -->
        </section>
        <!-- card end -->
    </main>
    <footer></footer>
</body>

</html>
